name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Tests (metrics, leakage, Kaggle CSV cleaning, train/evaluate)
        run: pytest -q
      - name: Demo pipeline end to end
        run: python -m prodrec.cli all --demo
